<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Secret Course</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            text-shadow: 0 0 10px #0f0;
        }

        #login-container {
            margin-top: 100px;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        form {
            display: inline-block;
            border: 1px solid #0f0;
            padding: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        input {
            background-color: #111;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 5px;
            margin-bottom: 10px;
            width: 200px;
        }

        button {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        button:hover {
            background-color: #fff;
            color: #000;
        }

        #error-message {
            color: #f00;
            text-shadow: 0 0 10px #f00;
        }

        #course-content {
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        #course-content header, #course-content section, #course-content footer {
            border: 1px solid #0f0;
            padding: 20px;
            margin-bottom: 20px;
        }

        #course-details img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1rem 0;
            border: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h1>ACCESS RESTRICTED</h1>
        <form id="login-form">
            <label for="username">USERNAME:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">PASSWORD:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">DECRYPT</button>
        </form>
        <p id="error-message"></p>
    </div>

    <main id="course-content" style="display: none;">
        <header>
            <h1>Welcome, Agent</h1>
        </header>
        <section id="course-details">
            <h2>TOP SECRET: Web Domination Course</h2>
            <p>This course will teach you the underground techniques of web manipulation. You will learn to control the web, not just build for it.</p>
            <img src="https://via.placeholder.com/400x200" alt="Hacker Image">
        </section>
        <section id="cta">
            <h2>You are in. Proceed with caution.</h2>
        </section>
        <footer>
            <p>&copy; 2025 Shadow Syndicate</p>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            const loginContainer = document.getElementById('login-container');
            const courseContent = document.getElementById('course-content');

            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = e.target.username.value;
                    const password = e.target.password.value;

                    if (username === 'admin' && password === 'admin') {
                        loginContainer.style.display = 'none';
                        courseContent.style.display = 'block';
                    } else {
                        errorMessage.textContent = 'ACCESS DENIED. INCORRECT CREDENTIALS.';
                        setTimeout(() => {
                            errorMessage.textContent = '';
                        }, 3000);
                    }
                });
            }
        });
    </script>
</body>
</html>
